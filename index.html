<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🌍 Language Translation Tool</h1>
        <p>Translate text from one language to another!</p>

        <textarea id="inputText" placeholder="Enter text to translate..."></textarea>

        <div class="language-box">
            <div>
                <label for="sourceLanguage">From:</label>
                <select id="sourceLanguage">
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="ta">Tamil</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>

            <div>
                <label for="targetLanguage">To:</label>
                <select id="targetLanguage">
                    <option value="te">Telugu</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="ta">Tamil</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                </select>
            </div>
        </div>

        <button id="translateButton">Translate</button>

        <h3>Translated Text:</h3>
        <textarea id="outputText" placeholder="Translation appears here..." readonly></textarea>

        <button id="copyButton">Copy Translation</button>
        <p id="status"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
